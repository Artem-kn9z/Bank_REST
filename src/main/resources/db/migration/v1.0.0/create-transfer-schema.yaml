databaseChangeLog:
  - changeSet:
      id: 3
      author: Artem Chernjakov
      changes:
        - createTable:
            tableName: transfer
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true

              - column:
                  name: from_card_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: to_card
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: transfer
            baseColumnNames: from_card_id
            referencedTableName: card
            referencedColumnNames: id
            constraintName: fk_transfer_from_card

        - addForeignKeyConstraint:
            baseTableName: transfer
            baseColumnNames: to_card
            referencedTableName: card
            referencedColumnNames: id
            constraintName: fk_transfer_to_card